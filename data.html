<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBTI 实验数据收集后台</title>
<style>
*{box-sizing:border-box;font-family:Microsoft YaHei,sans-serif}
body{background:#f5f7fa;padding:20px}
.container{max-width:1000px;margin:0 auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #0000001a}
h1{color:#4f46e5;text-align:center}
.btn{background:#4f46e5;color:white;padding:10px 20px;border:none;border-radius:8px;margin:5px;cursor:pointer}
.btn-red{background:#ef4444}
.btn-green{background:#10b981}
.data-box{margin-top:20px;padding:15px;background:#f9fafb;border-radius:8px;white-space:pre-wrap;font-size:14px}
.table{width:100%;border-collapse:collapse;margin-top:20px}
.table th,.table td{border:1px solid #ddd;padding:10px;text-align:left}
.table th{background:#f0f4ff}
.area{width:100%;height:200px;margin-top:10px;padding:10px;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="container">
<h1>📊 FBTI 实验数据收集面板（小白专用）</h1>

<button class="btn" onclick="saveData()">保存数据</button>
<button class="btn btn-green" onclick="exportCSV()">导出 Excel 文件</button>
<button class="btn btn-red" onclick="clearAll()">清空所有数据</button>

<textarea class="area" id="inputData" placeholder="把被试的数据粘贴到这里，点保存即可"></textarea>

<h3>已收集的数据列表</h3>
<div id="dataList"></div>

</div>

<script>
// 读取本地数据
function getData(){
    let d = localStorage.getItem("fbti_data");
    return d ? JSON.parse(d) : [];
}

// 保存数据
function saveData(){
    let t = document.getElementById("inputData").value.trim();
    if(!t){alert("请粘贴数据");return}
    let arr = getData();
    arr.push(t);
    localStorage.setItem("fbti_data", JSON.stringify(arr));
    document.getElementById("inputData").value = "";
    showList();
    alert("保存成功！");
}

// 显示数据
function showList(){
    let arr = getData();
    let html = "";
    arr.forEach((item,i)=>{
        html += `<div class='data-box'><b>第${i+1}份数据：</b><br>${item}</div>`;
    });
    document.getElementById("dataList").innerHTML = html || "<p>暂无数据</p>";
}

// 导出 Excel
function exportCSV(){
    let arr = getData();
    if(arr.length===0){alert("没有数据可导出");return}
    let csv = "数据内容\n"+arr.join("\n\n");
    let blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "FBTI实验数据.csv";
    a.click();
}

// 清空
function clearAll(){
    if(confirm("确定清空？不可恢复！")){
        localStorage.removeItem("fbti_data");
        showList();
    }
}

// 初始化
window.onload = function(){
    // 自动接收来自 FBTI 的数据
    let autoData = localStorage.getItem("AUTO_SUBMIT_FBTI");
    if(autoData){
        let arr = getData();
        arr.push(autoData);
        localStorage.setItem("fbti_data", JSON.stringify(arr));
        localStorage.removeItem("AUTO_SUBMIT_FBTI");
        alert("✅ 自动导入 1 条新数据！");
    }
    showList();
}
</script>
</body>
</html>
